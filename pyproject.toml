[project]
# Rename to your capability (e.g. "cover-letter-writer"), matching the repo.
name = "capability-module"
version = "0.1.0"
description = "One discrete capability with a clear contract."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "import-linter>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The importable package. Rename this together with the `capability/`
# folder to your capability's own name (snake_case) — a consumer does
# `from your_capability import run`, and the name must be unique across
# every capability a dashboard or orchestrator installs at once.
packages = ["capability"]
