[project]
name = "job-analyst"
version = "0.2.0"
description = "Analyse a job posting into a structured summary."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "import-linter>=2",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_analyst"]
